<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Login - PORTAL CBM</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/iconesite/icone.png">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #0d1117; /* Default dark background */
        }
        #login-screen {
            display: flex;
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body class="locked">
    <div id="login-screen">
        <div class="login-background"></div>
        <div class="login-container">
            <img src="assets/fotos/logo-capital.png" alt="Logo Capital" class="login-logo">
            <div id="login-clock" style="text-align: center; color: white; margin-bottom: 20px;">
                <div id="login-time" style="font-size: 3rem; font-weight: 800; letter-spacing: 2px; line-height: 1;">00:00:00</div>
                <div id="login-date" style="font-size: 1rem; color: #ccc; margin-top: 5px;">Data</div>
            </div>
            <h2>PORTAL CBM</h2>
            <div class="login-input-group">
                <input type="password" id="login-password" placeholder="Digite a senha de acesso..." autocomplete="off">
                <button id="login-submit">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
            <p id="login-error" style="display: none;">Senha incorreta. Tente novamente.</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loginPassword = document.getElementById('login-password');
            const loginSubmit = document.getElementById('login-submit');
            const loginError = document.getElementById('login-error');
            const loginTime = document.getElementById('login-time');
            const loginDate = document.getElementById('login-date');
            
            function updateLoginClock() {
                if (loginTime && loginDate) {
                    const now = new Date();
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    const seconds = String(now.getSeconds()).padStart(2, '0');
                    loginTime.textContent = `${hours}:${minutes}:${seconds}`;
                    
                    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                    loginDate.textContent = now.toLocaleDateString('pt-BR', options);
                }
            }
            setInterval(updateLoginClock, 1000);
            updateLoginClock();

            async function handleLogin() {
                if (loginSubmit) loginSubmit.disabled = true;
                try {
                    const response = await fetch('/api/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: loginPassword.value })
                    });

                    if (response.ok) {
                        loginError.style.display = 'none';
                        // Redirecionar para o url anterior ou para a raiz
                        const urlParams = new URLSearchParams(window.location.search);
                        const returnTo = urlParams.get('returnTo') || '/';
                        window.location.href = returnTo;
                    } else {
                        loginError.style.display = 'block';
                        loginPassword.value = '';
                        loginPassword.focus();
                        if (loginSubmit) loginSubmit.disabled = false;
                    }
                } catch (error) {
                    console.error("Erro na autenticação:", error);
                    loginError.textContent = "Erro ao conectar com o servidor.";
                    loginError.style.display = 'block';
                    if (loginSubmit) loginSubmit.disabled = false;
                }
            }

            if (loginSubmit) loginSubmit.addEventListener('click', handleLogin);
            if (loginPassword) loginPassword.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault(); 
                    handleLogin();
                }
            });

            loginPassword.focus();
        });
    </script>
</body>
</html>
